<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi cv - Bolsa de Empleo</title>
    <link rel="stylesheet" href="../static/css/estilos.css" th:href="@{/css/estilos.css}">
</head>
<body>
<header>
    <div class="header-left">
        <img src="../static/images/Logo.png" th:src="@{/images/Logo.png}" class="logo-img" alt="Logo">
        <span class="brand-name">Bolsa de Empleo</span>
        <nav>
            <a th:href="@{/oferente/dashboard}" class="nav-item"><span>DASHBOARD</span></a>
            <a th:href="@{/oferente/mis-habilidades}" class="nav-item"><span>MIS HABILIDADES</span></a>
            <a th:href="@{/oferente/mi-cv}" class="nav-item"><span>MI CV</span></a>
        </nav>
    </div>
    <div class="header-right">
        <span class="user-name" th:text="${usuario.nombreVisible}">Oferente Demo</span>
        <form th:action="@{/auth/logout}" method="post">
            <button type="submit" class="btn-secondary">Cerrar sesión</button>
        </form>
    </div>
</header>

<main>
    <div class="hero-section">
        <h1>Mi cv</h1>
        <p class="subtitle" th:text="${mensajeBienvenida}">Bienvenido oferente</p>
        <p class="subtitle">Sesión iniciada como <strong th:text="${usuario.nombreVisible}">Oferente Demo</strong>.</p>
    </div>
</main>
</body>
</html>
