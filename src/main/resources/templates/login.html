<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Bolsa de Empleo</title>
    <link rel="stylesheet" href="../static/css/estilos.css" th:href="@{/css/estilos.css}">
</head>
<body>

<header>
    <div class="header-left">
        <img src="../static/images/Logo.png" th:src="@{/images/Logo.png}" class="logo-img" alt="Logo">
        <span class="brand-name">Bolsa de Empleo</span>
        <nav>
            <a th:href="@{/}" class="nav-item">
                <span>Inicio</span>
            </a>
        </nav>
    </div>
</header>

<main class="login-main">
    <div class="login-card">
        <h1>¡Bienvenido a tu comunidad profesional!</h1>

        <form th:action="@{/auth/login}" method="POST" class="login-form">
            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="input-group">
                <label for="role">Ingresar como:</label>
                <select id="role" name="role" required>
                    <option value="oferente">Oferente (Persona)</option>
                    <option value="empresa">Empresa</option>
                    <option value="admin">Administrador del Sistema</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Iniciar sesión</button>
        </form>

        <div class="login-divider">
            <span>¿Eres nuevo en la Bolsa de Empleo? <a th:href="@{/registro}">Únete ahora</a></span>
        </div>
    </div>
</main>

<footer>
    <div class="footer-info">
        <b>Bolsa de Empleo</b>
        Mapaches Inc.
    </div>
    <div style="text-align: right;">
        <strong>Desarrolladores:</strong> Kevin Solorzano <br> Jose Perez <br> Marc Casadó
    </div>
</footer>

</body>
</html>
